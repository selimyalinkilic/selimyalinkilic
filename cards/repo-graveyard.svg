<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="108" viewBox="0 0 1280 108" role="img" aria-label="repo-graveyard — Walk through your abandoned GitHub repos in 3D. Each one gets a tombstone.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="1" stop-color="#151D44"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="108" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="107" rx="15.5" fill="none" stroke="#2A3560"/>
  <rect x="11" y="16" width="4" height="76" rx="2" fill="#FFB547" opacity="0.9"/>

  <text x="34" y="38" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="11" letter-spacing="2.2" fill="#5F6B90">PROJECT 01</text>
  <text x="34" y="78" font-family='"Rubik", Helvetica Neue, Helvetica, Arial, sans-serif' font-size="30" font-weight="700" letter-spacing="-0.7" fill="#FFFFFF">repo-graveyard</text>

  <text x="430" y="56" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="14.5" fill="#A9B2D6">Walk through your abandoned GitHub repos</text>
  <text x="430" y="78" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="14.5" fill="#A9B2D6">in 3D. Each one gets a tombstone.</text>

  <text x="1246" y="74" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="11" letter-spacing="2.2" fill="#FFB547" opacity="0.85" text-anchor="end">JUST SHIPPED</text>
  <circle cx="1246" cy="36" r="3" fill="#FFB547" opacity="0.75"/>
</svg>
