<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-label="Simple over clever: If it needs explaining, it can be simpler. · Fast by default: Speed is part of the design. · Details matter: The small things are the product.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="1" stop-color="#151D44"/>
    </linearGradient>
  </defs>

  <rect width="640" height="380" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="639" height="379" rx="19.5" fill="none" stroke="#2A3560"/>
  <text x="34" y="78" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="16" letter-spacing="2.4" fill="#FF6B9A" opacity="0.9">01</text>
  <text x="34" y="112" font-family='"Rubik", Helvetica Neue, Helvetica, Arial, sans-serif' font-size="27" font-weight="700" letter-spacing="-0.4" fill="#FFFFFF">Simple over clever</text>
  <text x="34" y="142" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="18" fill="#A9B2D6">If it needs explaining, it can be simpler.</text>
  <text x="34" y="186" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="16" letter-spacing="2.4" fill="#FFB547" opacity="0.9">02</text>
  <text x="34" y="220" font-family='"Rubik", Helvetica Neue, Helvetica, Arial, sans-serif' font-size="27" font-weight="700" letter-spacing="-0.4" fill="#FFFFFF">Fast by default</text>
  <text x="34" y="250" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="18" fill="#A9B2D6">Speed is part of the design.</text>
  <text x="34" y="294" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="16" letter-spacing="2.4" fill="#5B8CFF" opacity="0.9">03</text>
  <text x="34" y="328" font-family='"Rubik", Helvetica Neue, Helvetica, Arial, sans-serif' font-size="27" font-weight="700" letter-spacing="-0.4" fill="#FFFFFF">Details matter</text>
  <text x="34" y="358" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="18" fill="#A9B2D6">The small things are the product.</text>
</svg>
