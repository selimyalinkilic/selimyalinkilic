<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="158" viewBox="0 0 1280 158" role="img" aria-label="GitHub: 20 public repositories, 38 stars, 57 followers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="1" stop-color="#151D44"/>
    </linearGradient>
    <style>
      .label { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 2.4px; fill: #7D8AAE; }
      .value { font-family: "Rubik", Helvetica Neue, Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -1.2px; fill: #FFFFFF; }
      .hint  { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11.5px; fill: #5F6B90; }
      .stamp { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: 1.1px; fill: #4C5679; }
    </style>
  </defs>

  <rect width="1280" height="158" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="157" rx="19.5" fill="none" stroke="#2A3560"/>
    <g transform="translate(44.0 0)">
      <text y="58" class="label">SINCE</text>
      <text y="106" class="value">2017</text>
      <text y="130" class="hint">on GitHub</text>
    </g>
    <line x1="316.0" y1="42" x2="316.0" y2="116" stroke="#1E2749"/>
    <g transform="translate(342.0 0)">
      <text y="58" class="label">PUBLIC REPOS</text>
      <text y="106" class="value">20</text>
      <text y="130" class="hint">and private ones</text>
    </g>
    <line x1="614.0" y1="42" x2="614.0" y2="116" stroke="#1E2749"/>
    <g transform="translate(640.0 0)">
      <text y="58" class="label">STARS</text>
      <text y="106" class="value">38</text>
      <text y="130" class="hint">earned</text>
    </g>
    <line x1="912.0" y1="42" x2="912.0" y2="116" stroke="#1E2749"/>
    <g transform="translate(938.0 0)">
      <text y="58" class="label">FOLLOWERS</text>
      <text y="106" class="value">57</text>
      <text y="130" class="hint">and counting</text>
    </g>

  <g>
    <circle cx="1144" cy="34" r="4" fill="#FF6B9A"/>
    <circle cx="1160" cy="34" r="4" fill="#FFB547"/>
    <circle cx="1176" cy="34" r="4" fill="#2FBF7A"/>
    <text x="1236" y="58" class="stamp" text-anchor="end">UPDATED 14 NOV 2026</text>
  </g>
</svg>
