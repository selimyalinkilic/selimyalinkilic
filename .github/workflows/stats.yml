name: Profil kartları

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  kartlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kartları üret
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Değişiklik varsa commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg stats.mobil.svg intro.svg intro.mobil.svg care.svg care.mobil.svg cards social sections
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "İstatistik kartı güncellendi"
            git push
          fi
